# Project source is packed in lingora.tar.gz; the build step unpacks it.
services:
  - type: web
    name: lingora
    runtime: node
    plan: free
    buildCommand: tar xzf lingora.tar.gz && npm --prefix lingora/app install && npm --prefix lingora/app run build:web && npm --prefix lingora/server install
    startCommand: node lingora/server/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/lingora.db
      - key: CORS_ORIGIN
        value: "*"
